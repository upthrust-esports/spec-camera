<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Cam Wall</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#0a0d14;}

  .grid{
    display:grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows:    repeat(6, 1fr);
    gap:2px;
    width:1920px;
    height:1080px;
    background:#000;
  }

  .cam-cell{
    position:relative;
    overflow:hidden;
    background:#06090f;
    border:1px solid rgba(200,149,42,0.3);
  }

  /* video on top — hidden until live */
  .cam-cell video{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;display:block;
    z-index:2;
    opacity:0;
    transition:opacity .5s;
  }
  .cam-cell.live video{ opacity:1 !important; }

  /* default / player photo always visible behind video */
  .cam-cell .photo-fb{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center top;
    display:block;
    z-index:1;
  }

  /* team logo center — fades when live */
  .team-logo{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-60%);
    width:36px;height:36px;
    object-fit:contain;
    opacity:0.4;
    z-index:3;
    pointer-events:none;
    transition:opacity .5s;
  }
  .cam-cell.live .team-logo{opacity:0;}

  /* player name bottom */
  .name-bar{
    position:absolute;
    bottom:2px;left:4px;right:4px;
    z-index:5;
    font-family:'Rajdhani','Arial Narrow',sans-serif;
    font-size:10px;font-weight:700;
    color:#fff;letter-spacing:0.5px;
    text-transform:uppercase;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }

  /* live dot top-right */
  .live-dot{
    position:absolute;top:3px;right:3px;
    width:5px;height:5px;border-radius:50%;
    background:#00ff88;opacity:0;z-index:5;
    box-shadow:0 0 4px #00ff88;
    transition:opacity .3s;
  }
  .cam-cell.live .live-dot{opacity:1;animation:ldp 1.5s infinite;}
  @keyframes ldp{0%,100%{opacity:1}50%{opacity:.3}}

  /* slot number top-left for empty slots */
  .slot-num{
    position:absolute;top:3px;left:4px;
    font-size:8px;color:rgba(200,149,42,0.4);
    font-family:'Share Tech Mono',monospace;
    z-index:5;
  }

  /* corner accents */
  .ca{position:absolute;width:6px;height:6px;pointer-events:none;z-index:6;}
  .ca.tl{top:1px;left:1px;border-top:1px solid rgba(200,149,42,0.6);border-left:1px solid rgba(200,149,42,0.6);}
  .ca.tr{top:1px;right:1px;border-top:1px solid rgba(200,149,42,0.6);border-right:1px solid rgba(200,149,42,0.6);}
  .ca.bl{bottom:1px;left:1px;border-bottom:1px solid rgba(200,149,42,0.6);border-left:1px solid rgba(200,149,42,0.6);}
  .ca.br{bottom:1px;right:1px;border-bottom:1px solid rgba(200,149,42,0.6);border-right:1px solid rgba(200,149,42,0.6);}
</style>
</head>
<body>
<div class="grid" id="cam-grid"></div>

<script>
const WS_URL = (location.protocol==='https:'?'wss':'ws')+'://'+location.host;
const ROOM   = 'test';
const PASS   = 'test';
const TOTAL_SLOTS = 48; // fixed 8x6

let ws = null;
const peers        = new Map();
const playerPhotos = {};
const teamLogos    = {};
let   cameras      = []; // registered cameras from API

// Boot
(async function(){
  try {
    const [p, l, t, cam] = await Promise.all([
      fetch('/api/players/photos'),
      fetch('/api/logos'),
      fetch('/api/turn-config'),
      fetch('/api/spect/booyah-players?room='+ROOM+'&pass='+PASS)
    ]);
    const pd=await p.json(); const ld=await l.json();
    const td=await t.json(); const cd=await cam.json();
    if(pd.photos) Object.assign(playerPhotos, pd.photos);
    if(ld.logos)  Object.assign(teamLogos,    ld.logos);
    if(td.iceServers) window.ICE_SERVERS = td.iceServers;
    cameras = cd.players || [];
  } catch(e){ console.warn('Boot:', e); }

  buildGrid();
  connectWS();
})();

function buildGrid(){
  var grid = document.getElementById('cam-grid');
  grid.innerHTML = '';

  for(var i = 0; i < TOTAL_SLOTS; i++){
    var player  = cameras[i] || null;
    var uid     = player ? String(player.uid || '') : '';
    var pname   = player ? (player.playerName || uid) : '';
    var team    = player ? (player.team || '') : '';
    var photo   = uid ? (playerPhotos[uid] || null) : null;
    var logo    = team ? getTeamLogo(team) : null;
    var defImg  = '/players/' + ((i % 4) + 1) + '.png'; // cycles 1-4

    var cell = document.createElement('div');
    cell.className = 'cam-cell';
    cell.id = uid ? 'cell-'+uid : 'cell-slot'+i;

    // Slot number
    var sn = document.createElement('div');
    sn.className = 'slot-num';
    sn.textContent = (i+1);
    cell.appendChild(sn);

    // Default/player photo (always behind)
    var fb = document.createElement('img');
    fb.className = 'photo-fb';
    fb.id = uid ? 'photo-'+uid : 'photo-slot'+i;
    fb.src = photo || defImg;
    fb.onerror = function(){ this.onerror=null; this.style.display='none'; };
    cell.appendChild(fb);

    // Video (hidden until live)
    var vid = document.createElement('video');
    vid.autoplay=true; vid.playsInline=true; vid.muted=true;
    if(uid) vid.id = 'vid-' + uid;
    cell.appendChild(vid);

    // Team logo
    if(logo){
      var li = document.createElement('img');
      li.className='team-logo'; li.src=logo; li.id='logo-'+uid;
      cell.appendChild(li);
    }

    // Corner accents
    ['tl','tr','bl','br'].forEach(function(p2){
      var ca=document.createElement('div'); ca.className='ca '+p2; cell.appendChild(ca);
    });

    // Live dot
    var dot=document.createElement('div'); dot.className='live-dot'; cell.appendChild(dot);

    // Name
    if(pname){
      var bar=document.createElement('div'); bar.className='name-bar';
      bar.textContent=pname; cell.appendChild(bar);
    }

    grid.appendChild(cell);
  }
}

function connectWS(){
  ws = new WebSocket(WS_URL);
  ws.onopen = function(){
    send({ type:'register-booyah-cam', roomName:ROOM, roomPassword:PASS });
    console.log('[CAMWALL] WS connected');
  };
  ws.onclose = function(){ setTimeout(connectWS, 2000); };
  ws.onmessage = async function(e){
    var msg = JSON.parse(e.data);

    // Admin confirmed — request all player streams
    if(msg.type === 'booyah-registered'){
      console.log('[CAMWALL] Registered, requesting', cameras.length, 'streams');
      cameras.forEach(function(p){
        if(p.uid) send({type:'obs-ready', roomName:ROOM, roomPassword:PASS, spectId:'camwall', uid:p.uid});
      });
    }

    // New player joined — update their cell
    if(msg.type === 'player-joined' && msg.uid){
      var exists = cameras.find(function(x){ return x.uid===msg.uid; });
      if(!exists){
        cameras.push({uid:msg.uid, playerName:msg.playerName||msg.uid, team:msg.team||''});
        buildGrid(); // rebuild with new player
      }
      send({type:'obs-ready', roomName:ROOM, roomPassword:PASS, spectId:'camwall', uid:msg.uid});
    }

    // Player left — clear their cell
    if(msg.type === 'player-left' && msg.uid){
      var cell = document.getElementById('cell-'+msg.uid);
      if(cell) cell.classList.remove('live');
      if(peers.has(msg.uid)){ try{peers.get(msg.uid).pc.close();}catch{} peers.delete(msg.uid); }
    }

    // Relay offer from admin
    if(msg.type === 'relay-offer' || msg.type === 'offer'){
      await handleRelayOffer(msg.uid, msg.sdp, msg.viewerId||'camwall');
    }

    // ICE from admin
    if(msg.type === 'relay-ice'){
      var conn = peers.get(msg.uid);
      if(conn && conn.pc) try{ await conn.pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); }catch{}
    }
  };
}

async function handleRelayOffer(uid, sdp, viewerId){
  if(!uid) return;
  if(peers.has(uid)){ try{peers.get(uid).pc.close();}catch{} peers.delete(uid); }

  var iceServers = window.ICE_SERVERS || [{urls:'stun:stun.l.google.com:19302'}];
  var pc = new RTCPeerConnection({ iceServers:iceServers });
  peers.set(uid, {pc});

  pc.ontrack = function(ev){
    var vid  = document.getElementById('vid-'+uid);
    var cell = document.getElementById('cell-'+uid);
    console.log('[CAMWALL] ontrack uid:', uid, 'vid:', !!vid, 'cell:', !!cell, 'streams:', ev.streams.length);
    if(vid && ev.streams[0]){
      vid.srcObject = ev.streams[0];
      vid.style.opacity = '1';
      vid.style.zIndex  = '3';
      if(cell) cell.classList.add('live');
      var ph = document.getElementById('photo-'+uid);
      if(ph){ ph.style.opacity='0'; ph.style.transition='opacity .5s'; }
      console.log('[CAMWALL] Stream set for uid:', uid);
    }
  };

  pc.onicecandidate = function(ev){
    if(ev.candidate) send({
      type:'relay-ice-back',
      roomName:ROOM, roomPassword:PASS,
      uid:uid, candidate:ev.candidate, viewerId:viewerId||'camwall'
    });
  };

  pc.onconnectionstatechange = function(){
    if(pc.connectionState==='failed'||pc.connectionState==='disconnected'){
      var cell = document.getElementById('cell-'+uid);
      if(cell) cell.classList.remove('live');
      peers.delete(uid);
    }
  };

  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  var ans = await pc.createAnswer();
  await pc.setLocalDescription(ans);
  send({ type:'relay-answer', roomName:ROOM, roomPassword:PASS, uid:uid, sdp:pc.localDescription, viewerId:viewerId||'camwall' });
}

function getTeamLogo(name){
  if(!name) return null;
  if(teamLogos[name]) return teamLogos[name];
  var keys=Object.keys(teamLogos), low=name.toLowerCase().trim();
  for(var i=0;i<keys.length;i++) if(keys[i].toLowerCase().trim()===low) return teamLogos[keys[i]];
  return null;
}
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
</script>
</body>
</html>
