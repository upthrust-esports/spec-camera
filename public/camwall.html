<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Cam Wall</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script src="/lk-client.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#0a0d14;}

  /*
    MODE A (default): 6 cols × 8 rows = 48 cells
    cell = 320×180px (perfect 16:9)
    total = 1920×1440 → scroll? No — scale to fit:
    scale = 1080/1440 = 0.75 → width = 1920*0.75 = 1440 (not full width)

    MODE B: 8 cols × 6 rows = 48 cells
    cell = 240×135px (perfect 16:9)
    total = 1920×810 → center vertically, gap = 135px top/bottom

    MODE C (BEST FILL): 7 cols × 7 rows = 49 cells (close to 48)
    cell = 274×154px (16:9)
    total = 1920×1080 → PERFECT FILL ✅
    (1 empty cell in last row — hidden)

    Using MODE C: 7×7 = 49 slots, show 48, hide last one
  */

  .grid{
    display:grid;
    grid-template-columns:repeat(7, 1fr);
    grid-template-rows:repeat(7, 1fr);
    gap:0;
    width:1920px;
    height:1080px;
    background:#111;
  }

  .cam-cell{
    position:relative;
    overflow:hidden;
    background:#06090f;
    border:1px solid rgba(200,149,42,0.25);
    /* Each cell = 1920/7 × 1080/7 ≈ 274×154px = 16:9 ✅ */
  }

  .cam-cell.hidden-cell{
    visibility:hidden;
    border:none;
    background:transparent;
  }

  .cam-cell .photo-fb{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center;
    display:block;
    z-index:1;
  }

  .cam-cell video{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    z-index:2;
    opacity:0;
    transition:opacity .4s;
  }
  .cam-cell.live video{opacity:1;}

  .team-logo{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:28px;height:28px;
    object-fit:contain;opacity:0.2;
    z-index:3;pointer-events:none;transition:opacity .4s;
  }
  .cam-cell.live .team-logo{opacity:0;}

  .name-bar{
    position:absolute;bottom:0;left:0;right:0;z-index:5;
    padding:2px 4px;
    font-family:'Rajdhani','Arial Narrow',sans-serif;
    font-size:10px;font-weight:700;color:#fff;
    letter-spacing:.5px;text-transform:uppercase;
    text-shadow:0 1px 3px rgba(0,0,0,.9);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    background:linear-gradient(transparent,rgba(0,0,0,.7));
  }

  .live-dot{
    position:absolute;top:3px;right:3px;
    width:5px;height:5px;border-radius:50%;
    background:#00ff88;opacity:0;z-index:5;
    box-shadow:0 0 4px #00ff88;transition:opacity .3s;
  }
  .cam-cell.live .live-dot{opacity:1;animation:ldp 1.5s infinite;}
  @keyframes ldp{0%,100%{opacity:1}50%{opacity:.3}}

  .ca{position:absolute;width:5px;height:5px;z-index:6;pointer-events:none;}
  .ca.tl{top:1px;left:1px;border-top:1px solid rgba(200,149,42,.5);border-left:1px solid rgba(200,149,42,.5);}
  .ca.tr{top:1px;right:1px;border-top:1px solid rgba(200,149,42,.5);border-right:1px solid rgba(200,149,42,.5);}
  .ca.bl{bottom:1px;left:1px;border-bottom:1px solid rgba(200,149,42,.5);border-left:1px solid rgba(200,149,42,.5);}
  .ca.br{bottom:1px;right:1px;border-bottom:1px solid rgba(200,149,42,.5);border-right:1px solid rgba(200,149,42,.5);}
  .cam-cell.team-last{border-right:2px solid rgba(200,149,42,.6);}
</style>
</head>
<body>
<div class="grid" id="cam-grid"></div>
<script>
// 7×7 grid = 49 slots, we use 48, last slot hidden
const COLS   = 7;
const ROWS   = 7;
const TOTAL  = 48; // 49th cell is hidden filler
const SLOTS  = COLS * ROWS; // 49

const playerPhotos={}, teamLogos={};
let cameras=[];

(async function(){
  try {
    const [p,l,cam] = await Promise.all([
      fetch('/api/players/photos'),
      fetch('/api/logos'),
      fetch('/api/players/live')
    ]);
    const pd=await p.json(); const ld=await l.json(); const cd=await cam.json();
    if(pd.photos) Object.assign(playerPhotos, pd.photos);
    if(ld.logos)  Object.assign(teamLogos, ld.logos);
    cameras = sortByTeam(cd.players||[]);
  } catch(e){ console.warn('Boot:', e); }

  buildGrid();
  lkClient.connectWS('camwall');

  await lkClient.subscribeAll('camwall', null,
    function(uid, stream, playerName, team) {
      var exists = cameras.find(function(c){ return c && c.uid===uid; });
      if (!exists) {
        cameras.push({ uid, playerName: playerName||uid, team: team||'' });
        cameras = sortByTeam(cameras.filter(Boolean));
        buildGrid();
      }
      attachStream(uid, stream);
    },
    function(uid) {
      var cell = document.getElementById('cell-'+uid);
      if (cell) cell.classList.remove('live');
      var ph = document.getElementById('photo-'+uid);
      if (ph) ph.style.opacity = '1';
    }
  );

  window.addEventListener('lk-notify', function(e) {
    var msg = e.detail;
    if (msg.type === 'player-joined') {
      var exists = cameras.find(function(c){ return c && c.uid===msg.uid; });
      if (!exists) {
        cameras.push({ uid:msg.uid, playerName:msg.playerName||msg.uid, team:msg.team||'' });
        cameras = sortByTeam(cameras.filter(Boolean));
        buildGrid();
      }
    }
    if (msg.type === 'player-left') {
      var cell = document.getElementById('cell-'+msg.uid);
      if (cell) cell.classList.remove('live');
    }
  });
})();

function attachStream(uid, stream) {
  var vid  = document.getElementById('vid-'+uid);
  var cell = document.getElementById('cell-'+uid);
  if (vid && stream) {
    vid.srcObject = stream;
    vid.play().catch(function(){});
    if (cell) cell.classList.add('live');
    var ph = document.getElementById('photo-'+uid);
    if (ph) { ph.style.opacity='0'; ph.style.transition='opacity .5s'; }
  }
}

function sortByTeam(players) {
  var teams={};
  players.forEach(function(p){
    var t = p.team||'NO_TEAM';
    if (!teams[t]) teams[t]=[];
    teams[t].push(p);
  });
  var result=[];
  // Determine players per team group (4 per team)
  Object.keys(teams).sort().forEach(function(t){
    var m = teams[t].slice(0,4);
    while(m.length<4) m.push(null);
    result = result.concat(m);
  });
  return result;
}

function buildGrid() {
  var grid = document.getElementById('cam-grid');
  grid.innerHTML = '';

  for (var i=0; i<SLOTS; i++) {
    // Last slot (49th) is hidden filler to complete 7×7 grid
    if (i >= TOTAL) {
      var filler = document.createElement('div');
      filler.className = 'cam-cell hidden-cell';
      grid.appendChild(filler);
      continue;
    }

    var player = cameras[i] || null;
    var uid    = player ? String(player.uid||'') : '';
    var pname  = player ? (player.playerName||uid) : '';
    var team   = player ? (player.team||'') : '';
    var photo  = uid ? (playerPhotos[uid]||null) : null;
    var logo   = team ? getTeamLogo(team) : null;
    var defImg = '/players/'+((i%4)+1)+'.png';
    // Mark last player of each team group (every 4th)
    var isLast = (i%4===3);

    var cell = document.createElement('div');
    cell.className = 'cam-cell' + (isLast ? ' team-last' : '');
    if (uid) cell.id = 'cell-'+uid;

    var fb = document.createElement('img');
    fb.className = 'photo-fb';
    fb.id = uid ? 'photo-'+uid : 'photo-slot'+i;
    fb.src = photo || defImg;
    fb.onerror = function(){ this.onerror=null; this.src=defImg; };
    cell.appendChild(fb);

    var vid = document.createElement('video');
    vid.autoplay    = true;
    vid.playsInline = true;
    vid.muted       = true;
    if (uid) vid.id = 'vid-'+uid;
    cell.appendChild(vid);

    if (uid) {
      var s = lkClient.getStream(uid);
      if (s) {
        vid.srcObject = s;
        vid.play().catch(function(){});
        cell.classList.add('live');
        fb.style.opacity = '0';
      }
    }

    if (logo) {
      var li = document.createElement('img');
      li.className = 'team-logo'; li.src = logo;
      cell.appendChild(li);
    }

    ['tl','tr','bl','br'].forEach(function(pos){
      var ca = document.createElement('div');
      ca.className = 'ca '+pos;
      cell.appendChild(ca);
    });

    var dot = document.createElement('div');
    dot.className = 'live-dot';
    cell.appendChild(dot);

    if (pname) {
      var bar = document.createElement('div');
      bar.className = 'name-bar';
      bar.textContent = pname;
      cell.appendChild(bar);
    }

    grid.appendChild(cell);
  }
}

function getTeamLogo(name) {
  if (!name) return null;
  if (teamLogos[name]) return teamLogos[name];
  var keys = Object.keys(teamLogos), low = name.toLowerCase().trim();
  for (var i=0; i<keys.length; i++) if (keys[i].toLowerCase().trim()===low) return teamLogos[keys[i]];
  return null;
}
</script>
</body>
</html>
