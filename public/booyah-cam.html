<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Booyah Cam</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script src="/lk-client.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:transparent;}
  #stage{position:relative;width:1920px;height:1080px;background:transparent;}
  :root{
    --grid-top:5px;--grid-left:56px;--grid-right:7px;--grid-bottom:6px;--grid-gap:26px;
    --c0-top:-8px;--c0-bottom:-7px;--c0-left:-23px;--c0-right:-18px;--c0-scale:1;
    --c1-top:0px;--c1-bottom:0px;--c1-left:1px;--c1-right:7px;--c1-scale:1;
    --c2-top:-1px;--c2-bottom:0px;--c2-left:0px;--c2-right:0px;--c2-scale:1;
    --c3-top:0px;--c3-bottom:0px;--c3-left:0px;--c3-right:0px;--c3-scale:1;
    --n0-bottom:44px;--n0-left:33px;--n0-size:22px;
    --n1-bottom:44px;--n1-left:33px;--n1-size:22px;
    --n2-bottom:44px;--n2-left:33px;--n2-size:22px;
    --n3-bottom:44px;--n3-left:33px;--n3-size:22px;
  }
  .grid{position:absolute;top:var(--grid-top);left:var(--grid-left);right:var(--grid-right);bottom:var(--grid-bottom);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:var(--grid-gap);}
  .cam-cell{position:relative;overflow:hidden;background:transparent;}
  .cam-cell .photo-fb{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:1;}
  .cam-cell video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;z-index:2;opacity:0;transition:opacity .4s;}
  .cam-cell.live video{opacity:1;}
  #cam-cell-0 video{object-position:calc(50% + var(--c0-left) - var(--c0-right)) calc(50% + var(--c0-top) - var(--c0-bottom));transform:scale(var(--c0-scale));transform-origin:center;}
  #cam-cell-1 video{object-position:calc(50% + var(--c1-left) - var(--c1-right)) calc(50% + var(--c1-top) - var(--c1-bottom));transform:scale(var(--c1-scale));transform-origin:center;}
  #cam-cell-2 video{object-position:calc(50% + var(--c2-left) - var(--c2-right)) calc(50% + var(--c2-top) - var(--c2-bottom));transform:scale(var(--c2-scale));transform-origin:center;}
  #cam-cell-3 video{object-position:calc(50% + var(--c3-left) - var(--c3-right)) calc(50% + var(--c3-top) - var(--c3-bottom));transform:scale(var(--c3-scale));transform-origin:center;}
  @font-face{font-family:'GFF Latin';src:url('/fonts/GFFLatin-Bold.ttf') format('truetype');font-weight:700;}
  .name-label{position:absolute;z-index:200;font-family:'GFF Latin','Rajdhani',sans-serif;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:2px;white-space:nowrap;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.9);}
  #name-0{bottom:var(--n0-bottom);left:var(--n0-left);font-size:var(--n0-size);}
  #name-1{bottom:var(--n1-bottom);left:var(--n1-left);font-size:var(--n1-size);}
  #name-2{bottom:var(--n2-bottom);left:var(--n2-left);font-size:var(--n2-size);}
  #name-3{bottom:var(--n3-bottom);left:var(--n3-left);font-size:var(--n3-size);}
  #frame-img{position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:100;}
</style>
</head>
<body>
<div id="stage">
  <div class="grid" id="cam-grid"></div>
  <img id="frame-img" src="/frame.png" alt=""/>
</div>
<script>
const playerPhotos = {};
const teamLogos    = {};
let   booyahPlayers = [];

(async function(){
  try {
    const [p,l] = await Promise.all([fetch('/api/players/photos'), fetch('/api/logos')]);
    const pd=await p.json(); const ld=await l.json();
    if(pd.photos) Object.assign(playerPhotos, pd.photos);
    if(ld.logos)  Object.assign(teamLogos, ld.logos);
  } catch {}

  buildGrid([]);
  lkClient.connectWS('booyah');

  // Subscribe to all streams
  await lkClient.subscribeAll('booyah', null,
    function(uid, stream, playerName) {
      const vid  = document.getElementById('bvid-'+uid);
      const cell = document.getElementById('bcell-'+uid);
      if (vid && stream) {
        vid.srcObject = stream;
        if (cell) cell.classList.add('live');
        const ph = document.getElementById('bphoto-'+uid);
        if (ph) { ph.style.opacity='0'; ph.style.transition='opacity .5s'; }
      }
    },
    function(uid) {
      const cell = document.getElementById('bcell-'+uid);
      if (cell) cell.classList.remove('live');
      const ph = document.getElementById('bphoto-'+uid);
      if (ph) ph.style.opacity='1';
    }
  );

  // Listen for booyah events
  window.addEventListener('lk-notify', function(e) {
    const msg = e.detail;
    if (msg.type === 'booyah-detected') {
      booyahPlayers = msg.players || [];
      buildGrid(booyahPlayers);
    }
    if (msg.type === 'booyah-reset') {
      booyahPlayers = [];
      buildGrid([]);
    }
  });

  // Load current booyah players
  try {
    const res  = await fetch('/api/spect/booyah-players');
    const data = await res.json();
    if (data.players && data.players.length) { booyahPlayers = data.players; buildGrid(booyahPlayers); }
  } catch {}
})();

function buildGrid(players) {
  if (!players || !players.length) {
    players = [{uid:'',playerName:'SLOT 1'},{uid:'',playerName:'SLOT 2'},
               {uid:'',playerName:'SLOT 3'},{uid:'',playerName:'SLOT 4'}];
  }
  var grid = document.getElementById('cam-grid');
  grid.innerHTML = '';
  var slots = players.slice(0,4);
  while(slots.length < 4) slots.push({uid:'',playerName:'—'});

  slots.forEach(function(player, cellIndex) {
    var uid    = player ? String(player.uid||'') : '';
    var pname  = player ? (player.playerName||uid) : '—';
    var photo  = uid ? (playerPhotos[uid]||null) : null;
    var defSrc = '/players/'+(cellIndex+1)+'.png';

    var cell = document.createElement('div');
    cell.className = 'cam-cell';
    cell.id = 'cam-cell-'+cellIndex;
    if (uid) cell.id = 'bcell-'+uid;

    var fb = document.createElement('img');
    fb.className='photo-fb';
    fb.id='bphoto-'+(uid||'slot'+cellIndex);
    fb.src=photo||defSrc;
    fb.onerror=function(){this.onerror=null;this.src=defSrc;};
    cell.appendChild(fb);

    var vid = document.createElement('video');
    vid.autoplay=true; vid.playsInline=true; vid.muted=true;
    if(uid) vid.id='bvid-'+uid;
    cell.appendChild(vid);

    // Also show stream if already subscribed
    if (uid) {
      var s = lkClient.getStream(uid);
      if (s) { vid.srcObject=s; cell.classList.add('live'); fb.style.opacity='0'; }
    }

    var nameEl=document.createElement('div');
    nameEl.className='name-label';
    nameEl.id='name-'+cellIndex;
    nameEl.textContent=pname!=='—'?pname:'';
    cell.appendChild(nameEl);

    grid.appendChild(cell);
  });
}
</script>
</body>
</html>
