<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Booyah Cam</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1920px;height:1080px;overflow:hidden;background:#000;}

  #stage{
    position:relative;
    width:1920px;height:1080px;
  }

  /* 2x2 camera grid — fills entire stage */
  .grid{
    position:absolute;
    inset:0;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
  }

  .cam-cell{
    position:relative;
    overflow:hidden;
    background:#000;
  }

  .cam-cell video{
    width:100%;height:100%;
    object-fit:cover;display:block;
  }

  .cam-cell .photo-fb{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;display:block;
  }

  .cell-wait{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    background:#000;
  }
  .cell-wait-ring{
    width:40px;height:40px;
    border:2px solid rgba(255,255,255,0.1);
    border-top-color:rgba(255,255,255,0.4);
    border-radius:50%;
    animation:spin 1s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Frame PNG on top of everything */
  #frame-img{
    position:absolute;
    inset:0;
    width:1920px;height:1080px;
    object-fit:fill;
    pointer-events:none;
    z-index:50;
  }

  /* Waiting state */
  #waiting{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
    background:#000;z-index:100;
  }
</style>
</head>
<body>

<div id="waiting">
  <div class="cell-wait-ring"></div>
</div>

<div id="stage" style="display:none;">
  <div class="grid" id="cam-grid"></div>
  <img id="frame-img" src="/frame.png" alt=""/>
</div>

<script>
const API    = location.origin;
const WS_URL = (location.protocol==='https:'?'wss':'ws')+'://'+location.host;
const params = new URLSearchParams(location.search);
const ROOM   = params.get('room') || 'test';
const PASS   = params.get('pass') || 'test';

let ws = null;
let booyahShown = false;
const peers = new Map();
const playerPhotos = {};
const teamLogos    = {};

(async function(){
  try {
    const [p,l,t] = await Promise.all([
      fetch('/api/players/photos'),
      fetch('/api/logos'),
      fetch('/api/turn-config')
    ]);
    const pd=await p.json(); const ld=await l.json(); const td=await t.json();
    if(pd.photos) Object.assign(playerPhotos, pd.photos);
    if(ld.logos)  Object.assign(teamLogos,    ld.logos);
    if(td.iceServers) window.ICE_SERVERS = td.iceServers;
  } catch(e){ console.warn('Boot:', e); }

  await showBooyah('', null, []);
  connectWS();
})();

function connectWS(){
  ws = new WebSocket(WS_URL);
  ws.onopen  = () => send({ type:'register-booyah-cam', roomName:ROOM, roomPassword:PASS });
  ws.onclose = () => setTimeout(connectWS, 2000);
  ws.onmessage = async (e) => {
    const msg = JSON.parse(e.data);

    if(msg.type === 'booyah-registered'){
      console.log('[BOOYAH] Registered — admin will relay streams');
    }

    if(msg.type === 'booyah-detected'){
      booyahShown = true;
      peers.forEach(function(conn){ if(conn && conn.pc) conn.pc.close(); });
      peers.clear();
      await showBooyah(msg.teamName, msg.teamLogo, msg.players);
    }

    if(msg.type === 'booyah-reset'){
      booyahShown = false;
      peers.forEach(function(conn){ if(conn && conn.pc) conn.pc.close(); });
      peers.clear();
      await showBooyah('', null, []);
    }

    // relay-offer from admin — admin forwards player stream to us
    if(msg.type === 'relay-offer' || msg.type === 'offer'){
      console.log('[BOOYAH] relay-offer for uid:', msg.uid);
      await handleRelayOffer(msg.uid, msg.sdp);
    }

    // relay-ice from admin
    if(msg.type === 'relay-ice'){
      const conn = peers.get(msg.uid);
      if(conn && conn.pc) try{ await conn.pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); }catch{}
    }

    // answer (fallback)
    if(msg.type === 'answer'){
      const conn = peers.get(msg.uid);
      if(conn && conn.pc && conn.pc.signalingState !== 'stable')
        await conn.pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    }
  };
}

async function showBooyah(teamName, teamLogoUrl, players){
  if(!players || !players.length){
    try{
      var res = await fetch('/api/spect/booyah-players?room='+encodeURIComponent(ROOM)+'&pass='+encodeURIComponent(PASS));
      var data = await res.json();
      if(data.players && data.players.length) players = data.players;
    }catch(e){}
    if(!players || !players.length){
      players = [{uid:'',playerName:''},{uid:'',playerName:''},{uid:'',playerName:''},{uid:'',playerName:''}];
    }
  }

  document.getElementById('waiting').style.display = 'none';
  document.getElementById('stage').style.display   = 'block';

  var grid = document.getElementById('cam-grid');
  grid.innerHTML = '';
  var slots = players.slice(0,4);
  while(slots.length < 4) slots.push({uid:'',playerName:''});

  slots.forEach(function(player){
    var uid   = player ? String(player.uid || '') : '';
    var photo = uid ? (playerPhotos[uid] || null) : null;

    var cell = document.createElement('div');
    cell.className = 'cam-cell';

    var vid = document.createElement('video');
    vid.autoplay = true; vid.playsInline = true;
    if(uid) vid.id = 'bvid-'+uid;
    cell.appendChild(vid);

    if(photo){
      var img = document.createElement('img');
      img.src = photo; img.className = 'photo-fb';
      if(uid) img.id = 'bphoto-'+uid;
      cell.appendChild(img);
    } else if(uid) {
      var w = document.createElement('div'); w.className='cell-wait';
      if(uid) w.id='bcellwait-'+uid;
      var ring = document.createElement('div'); ring.className='cell-wait-ring';
      w.appendChild(ring); cell.appendChild(w);
    }

    grid.appendChild(cell);
  });
}

async function handleRelayOffer(uid, sdp){
  if(peers.has(uid)){ try{peers.get(uid).pc.close();}catch{} peers.delete(uid); }
  var iceServers = window.ICE_SERVERS || [{urls:'stun:stun.l.google.com:19302'}];
  var pc = new RTCPeerConnection({ iceServers });
  peers.set(uid, {pc});

  pc.ontrack = function(ev){
    var vid = document.getElementById('bvid-'+uid);
    if(vid){
      vid.srcObject = ev.streams[0];
      var ph = document.getElementById('bphoto-'+uid);
      if(ph) ph.style.display='none';
      var cw = document.getElementById('bcellwait-'+uid);
      if(cw) cw.style.display='none';
    }
  };

  pc.onicecandidate = function(ev){
    if(ev.candidate) send({type:'relay-ice-back',roomName:ROOM,roomPassword:PASS,uid:uid,candidate:ev.candidate,viewerId:'booyah'});
  };

  await pc.setRemoteDescription(new RTCSessionDescription(sdp));
  var answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
  send({type:'relay-answer',roomName:ROOM,roomPassword:PASS,uid:uid,sdp:pc.localDescription,viewerId:'booyah'});
}

// No requestStream needed — admin relays stream via relay-offer on booyah-registered

function getLogo(name){
  if(!name) return null;
  if(teamLogos[name]) return teamLogos[name];
  var k=Object.keys(teamLogos), l=name.toLowerCase().trim();
  for(var i=0;i<k.length;i++) if(k[i].toLowerCase().trim()===l) return teamLogos[k[i]];
  return null;
}
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
</script>
</body>
</html>
