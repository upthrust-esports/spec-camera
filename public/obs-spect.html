<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>OBS Spect</title>
<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
<script src="/lk-client.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;background:transparent;overflow:hidden;}
  #feed{width:100%;height:100%;object-fit:cover;display:block;background:transparent;}
  body.no-stream #feed{display:none;}
</style>
</head>
<body class="no-stream">
<video id="feed" autoplay playsinline></video>
<script>
const pathMatch = location.pathname.match(/spect(\d+)/i);
const SPECT_ID  = pathMatch ? pathMatch[1] : '1';
let currentUid  = null;

(async function(){
  // Connect WS for spect update notifications
  lkClient.connectWS('spect');

  // Get assigned uid
  try {
    const res  = await fetch('/api/spect/' + SPECT_ID);
    const data = await res.json();
    if (data.uid) currentUid = data.uid;
  } catch {}

  // Subscribe to all streams
  await lkClient.subscribeAll('spect', SPECT_ID,
    function(uid, stream) {
      if (uid === currentUid) showStream(stream);
    },
    function(uid) {
      if (uid === currentUid) hideStream();
    }
  );

  // Show current uid stream if already connected
  if (currentUid) {
    const s = lkClient.getStream(currentUid);
    if (s) showStream(s);
  }

  // Listen for spect assignment changes
  window.addEventListener('lk-notify', function(e) {
    const msg = e.detail;
    if (msg.type === 'spect-update' && String(msg.spectId) === String(SPECT_ID)) {
      if (msg.uid && msg.uid !== currentUid) {
        currentUid = msg.uid;
        const s = lkClient.getStream(msg.uid);
        if (s) showStream(s);
        else hideStream();
      } else if (!msg.uid) {
        currentUid = null;
        hideStream();
      }
    }
    if (msg.type === 'connected' && msg.spectators) {
      const uid = msg.spectators[SPECT_ID];
      if (uid) { currentUid = uid; const s = lkClient.getStream(uid); if(s) showStream(s); }
    }
  });

  // Poll fallback every 3s
  setInterval(async () => {
    try {
      const res  = await fetch('/api/spect/' + SPECT_ID);
      const data = await res.json();
      if (data.uid && data.uid !== currentUid) {
        currentUid = data.uid;
        const s = lkClient.getStream(data.uid);
        if (s) showStream(s);
      }
    } catch {}
  }, 3000);
})();

function showStream(stream) {
  document.getElementById('feed').srcObject = stream;
  document.body.classList.remove('no-stream');
}
function hideStream() {
  document.getElementById('feed').srcObject = null;
  document.body.classList.add('no-stream');
}
</script>
</body>
</html>
